<div class="habit-grid">
    @for(month of months; track month) {
        <div class="row">
            <div class="month-name">
                {{getMonthName(month)}}
            </div>
            @for (day of getDaysForMonth(month) ; track day) {
                <div class="element">
                    <app-habit-grid-day/>
                </div>
            }
        </div>
    }
</div>
