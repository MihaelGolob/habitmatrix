<div class="backdrop" (click)="onBackdropClick()">
    <div class="modal" (click)="$event.stopPropagation()">
        <div class="header">
            <h3>Habits for <span class="date">{{ date() | date:"mediumDate"}}</span></h3>
            <button class="icon-btn" aria-label="Close" (click)="cancel()">✕</button>
        </div>

        <div class="content">
            @if(habits().length <= 0) {
                <div class="empty">
                    No habits yet.
                </div>
            }

            @for (h of habits(); track h.id) {
                <div class="habit-row">
                    <label>
                        <span class="dot" [style.backgroundColor]="h.colorHex || '#888'"></span>
                        <span class="label">{{ h.name }}</span>
                        <div class="checkbox-wrapper-24">
                            <input
                                type="checkbox"
                                id="check-{{ h.id }}"
                                [checked]="isSelected(h.id)"
                                (change)="toggle(h.id, $event.target.checked)"
                            />
                            <label for="check-{{ h.id }}">
                                <span><!-- This span is needed to create the "checkbox" element --></span>
                            </label>
                        </div>
                    </label>
                </div>
            }
        </div>

        <div class="actions">
            <button class="btn" (click)="cancel()">Cancel</button>
            <button class="btn primary" (click)="save()">Save</button>
        </div>
    </div>
</div>
